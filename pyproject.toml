[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drawing-handoff-checker"
version = "0.1.0"
description = "Check drawing handoffs against a sheet list using filenames and revisions."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
drawing-handoff-check = "drawing_handoff_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawing_handoff_checker = ["filename-rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
